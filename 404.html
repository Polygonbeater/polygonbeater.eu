<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Stránka nenalezena | Polygon Beater</title>

<!-- SEO Meta Tagy -->
<meta name="robots" content="noindex, follow">

<!-- Favicona -->
<link rel="icon" type="image/svg+xml" href="/Logo.svg">

<!-- Přímé načtení písem bez zpoždění LCP -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap">

<style>
  :root{
    --red-500:#FF4D4D;
    --red-700:#B7151B;
    --ink-950:#0B0B0C;
    --steel-300:#E2DFD7;
    --white:#FFFFFF;

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;

    --edge: 1px solid rgba(255,255,255,0.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink-950);
    color:var(--white);
    font-family:var(--body);
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:space-between;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}

  header{
    border-bottom:var(--edge);
    padding:20px 32px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:38px; height:38px; border-radius:6px;
    overflow:hidden; background:var(--white); flex-shrink:0;
  }
  .brand-mark img{width:100%; height:100%; object-fit:cover;}
  .brand-word .name{
    font-family:var(--display); font-weight:900; font-size:19px;
    letter-spacing:0.01em; text-transform:uppercase; color:var(--white);
  }
  .brand-word .sub{
    font-family:var(--mono); font-size:9.5px; letter-spacing:0.16em;
    color:var(--red-500); text-transform:uppercase; font-weight:600;
  }

  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:60px 20px; text-align:center;
  }
  .content{max-width:540px;}
  .num{
    font-family:var(--display); font-size:clamp(90px, 15vw, 140px);
    font-weight:900; color:var(--red-500); line-height:0.85;
  }
  h1{
    font-family:var(--display); font-size:28px; text-transform:uppercase;
    margin:18px 0 12px; letter-spacing:0.02em;
  }
  p{color:var(--steel-300); font-size:16px; margin-bottom:32px;}
  
  .btn-primary{
    font-family:var(--mono); font-size:13px; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--red-700); color:var(--white); padding:16px 28px;
    border:1px solid var(--red-700); display:inline-block; font-weight:600;
    transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .btn-primary:hover{background:transparent; color:var(--white); transform:translateY(-1px);}

  footer{
    border-top:var(--edge); padding:24px 32px; text-align:center;
    font-family:var(--mono); font-size:11.5px; color:var(--steel-300);
  }
</style>
</head>
<body>

<header>
  <a href="/" class="brand">
    <span class="brand-mark"><img src="/Logo.svg" alt="Polygon Beater logo"></span>
    <span class="brand-word">
      <span class="name">Polygon Beater</span><br>
      <span class="sub">3D Graphic Studio</span>
    </span>
  </a>
</header>

<main>
  <div class="content">
    <div class="num">404</div>
    <h1>Stránka nenalezena</h1>
    <p>Požadovaná adresa na tomto serveru neexistuje nebo byla přesunuta.</p>
    <a href="/" class="btn-primary">← Zpět na hlavní stranu</a>
  </div>
</main>

<footer>
  © <span id="year"></span> Polygon Beater 3D Graphic Studio
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
